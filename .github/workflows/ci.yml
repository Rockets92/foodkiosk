name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed packages server
      - run: dart analyze --fatal-infos packages server
      - run: dart test
        working-directory: packages/kiosk_core
      - run: dart test
        working-directory: server

  kiosk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/kiosk
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --fatal-infos
      - run: flutter test
      - run: flutter build web --base-href /kiosk/ --no-web-resources-cdn
